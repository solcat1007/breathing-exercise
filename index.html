<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呼吸练习 | Breathing Exercise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;user-select:none}
.lang-btn{position:fixed;top:16px;left:16px;background:transparent;border:2px solid #00BCD4;color:#00BCD4;font-size:12px;font-weight:700;padding:6px 12px;border-radius:4px;cursor:pointer;z-index:10;letter-spacing:1px}
.lang-btn:hover{background:#00BCD4;color:#fff}
.fullscreen-btn{position:fixed;top:16px;right:16px;background:#00BCD4;color:#fff;border:none;font-size:12px;font-weight:700;padding:6px 12px;border-radius:4px;cursor:pointer;z-index:10;font-family:inherit}
.fullscreen-btn:hover{background:#0097A7}
.main{display:flex;flex-direction:column;align-items:center;gap:24px}
canvas{display:block}
.label{font-size:28px;font-weight:300;color:#00BCD4;letter-spacing:2px;min-height:40px;text-align:center}
.timer-text{font-size:14px;color:#aaa;letter-spacing:1px;min-height:20px}
.pattern-select{display:flex;gap:8px}
.pattern-btn{background:transparent;border:2px solid #e0e0e0;color:#999;font-size:13px;font-weight:600;padding:8px 16px;border-radius:6px;cursor:pointer;letter-spacing:1px;transition:all .2s}
.pattern-btn.active{border-color:#00BCD4;color:#00BCD4}
.pattern-btn:hover{border-color:#00BCD4}
.btn{background:#fff;border:2px solid #00BCD4;color:#00BCD4;font-size:14px;font-weight:700;padding:12px 40px;border-radius:8px;cursor:pointer;letter-spacing:2px;transition:all .2s;margin-top:8px}
.btn:hover{background:#00BCD4;color:#fff}
.cycle-count{font-size:13px;color:#aaa;letter-spacing:1px;min-height:18px}
</style>
</head>
<body>
<button class="lang-btn" onclick="toggleLang()" id="langBtn">中/EN</button>
<button class="fullscreen-btn" onclick="toggleFullscreen()" id="fsBtn">全屏</button>
<div class="main">
  <div class="pattern-select">
    <button class="pattern-btn active" onclick="setPattern(0)" id="p0" data-key="p478">4-7-8</button>
    <button class="pattern-btn" onclick="setPattern(1)" id="p1" data-key="box">盒式</button>
    <button class="pattern-btn" onclick="setPattern(2)" id="p2" data-key="p4444">4-4-4-4</button>
  </div>
  <canvas id="canvas" width="280" height="280"></canvas>
  <div class="label" id="label">准备</div>
  <div class="timer-text" id="timerText">--</div>
  <div class="cycle-count" id="cycleCount"></div>
  <button class="btn" id="startBtn" onclick="toggle()" data-key="start">开始</button>
</div>
<script>
let lang='zh';
const L={
zh:{ready:'准备',inhale:'吸气',hold:'屏息',exhale:'呼气',rest:'放松',start:'开始',stop:'停止',
  box:'盒式',p478:'4-7-8',p4444:'4-4-4-4',cycle:'第 {n} 轮 / 共 {t} 轮',done:'练习完成'},
en:{ready:'Ready',inhale:'Inhale',hold:'Hold',exhale:'Exhale',rest:'Rest',start:'Start',stop:'Stop',
  box:'Box',p478:'4-7-8',p4444:'4-4-4-4',cycle:'Cycle {n} / {t}',done:'Session Complete'}
};
function t(k){return L[lang][k]||k}
function toggleLang(){lang=lang==='zh'?'en':'zh';updateTexts()}
function updateTexts(){
  document.getElementById('p0').textContent=t('p478');document.getElementById('p1').textContent=t('box');document.getElementById('p2').textContent=t('p4444');
  document.getElementById('startBtn').textContent=running?t('stop'):t('start');
  updateLabel();updateCycle()
}
function toggleFullscreen(){
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){let e=document.documentElement;e.requestFullscreen?e.requestFullscreen():e.webkitRequestFullscreen()}else{document.exitFullscreen?document.exitFullscreen():document.webkitExitFullscreen()}
}
const patterns=[
  {name:'4-7-8',steps:[{label:'inhale',dur:4},{label:'hold',dur:7},{label:'exhale',dur:8},{label:'rest',dur:1}],totalCycles:4},
  {name:'box',steps:[{label:'inhale',dur:4},{label:'hold',dur:4},{label:'exhale',dur:4},{label:'rest',dur:4}],totalCycles:5},
  {name:'4-4-4-4',steps:[{label:'inhale',dur:4},{label:'hold',dur:4},{label:'exhale',dur:4},{label:'rest',dur:4}],totalCycles:4}
];
let patIdx=0,running=false,stepIdx=0,stepRemain=0,cycleNum=0,timer=null;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),cx=140,cy=140,maxR=120;
function setPattern(i){if(running)return;patIdx=i;
  document.querySelectorAll('.pattern-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  drawCircle(0);document.getElementById('label').textContent=t('ready');document.getElementById('timerText').textContent='--';document.getElementById('cycleCount').textContent=''}
function toggle(){
  if(running){running=false;clearInterval(timer);document.getElementById('startBtn').textContent=t('start');drawCircle(0);document.getElementById('label').textContent=t('ready');document.getElementById('timerText').textContent='--';document.getElementById('cycleCount').textContent=''}else{startExercise()}}
function startExercise(){
  running=true;cycleNum=0;stepIdx=0;document.getElementById('startBtn').textContent=t('stop');nextStep()}
function nextStep(){
  if(!running)return;
  let p=patterns[patIdx];
  if(stepIdx>=p.steps.length){cycleNum++;if(cycleNum>=p.totalCycles){finish();return}stepIdx=0;updateCycle()}
  let step=p.steps[stepIdx];stepRemain=step.dur;
  document.getElementById('label').textContent=t(step.label);
  document.getElementById('timerText').textContent=stepRemain+'s';
  drawCircle(1);
  timer=setInterval(()=>{stepRemain--;document.getElementById('timerText').textContent=stepRemain+'s';
    let total=step.dur;let progress=total>0?(total-stepRemain)/total:0;
    if(step.label==='exhale'||step.label==='rest')progress=1-progress;
    drawCircle(progress);
    if(stepRemain<=0){clearInterval(timer);stepIdx++;nextStep()}},1000)}
function updateCycle(){if(running)document.getElementById('cycleCount').textContent=t('cycle').replace('{n}',cycleNum+1).replace('{t}',patterns[patIdx].totalCycles)}
function finish(){running=false;clearInterval(timer);document.getElementById('label').textContent=t('done');document.getElementById('timerText').textContent='';document.getElementById('cycleCount').textContent='';document.getElementById('startBtn').textContent=t('start');drawCircle(1)}
function drawCircle(progress){
  ctx.clearRect(0,0,280,280);
  ctx.beginPath();ctx.arc(cx,cy,maxR,0,Math.PI*2);ctx.strokeStyle='#f0f8f9';ctx.lineWidth=3;ctx.stroke();
  let angle=-Math.PI/2;
  ctx.beginPath();ctx.arc(cx,cy,maxR,angle,angle+Math.PI*2*Math.min(1,Math.max(0,progress)));ctx.strokeStyle='#00BCD4';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,maxR-60,0,Math.PI*2);ctx.fillStyle='rgba(0,188,212,0.06)';ctx.fill()
}
drawCircle(0);
</script>
</body>
</html>
